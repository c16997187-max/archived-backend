<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArchivED Capture</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: #f4f5f7; color: #1c2430;
         font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .ref { margin: 0 0 16px; color: #566072; font-size: 15px; }
  .big-button { display: block; width: 100%; padding: 16px; margin: 12px 0 0; border: 0;
                border-radius: 10px; background: #1f5fbf; color: #fff; text-align: center;
                font: inherit; font-weight: 600; cursor: pointer; }
  .big-button.secondary { background: #e2e6ec; color: #1c2430; }
  .big-button:disabled { opacity: .55; }
  .message { padding: 12px 14px; border-radius: 10px; background: #fff; }
  .message.error { background: #fdecea; color: #8c1d18; }
  .message.success { background: #e6f4ea; color: #14532d; font-weight: 600; }
  #stage { position: relative; touch-action: none; user-select: none; -webkit-user-select: none;
           line-height: 0; }
  #photo { display: block; width: 100%; height: auto; border-radius: 6px; }
  #outline { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .handle { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px;
            border-radius: 50%; touch-action: none; cursor: grab; }
  .handle::after { content: ""; position: absolute; inset: 12px; border-radius: 50%;
                   background: #1f5fbf; border: 3px solid #fff; box-shadow: 0 0 3px #0008; }
  progress { width: 100%; height: 12px; margin-top: 12px; }
  [hidden] { display: none !important; }
  #file-input, #gallery-input { position: absolute; width: 1px; height: 1px; opacity: 0; }
</style>
</head>
<body>
<main>
  <h1>ArchivED Capture</h1>
  <p class="ref" id="reference"></p>

  <p class="message" id="status" role="status">Connecting…</p>

  <section id="ready" hidden>
    <input id="file-input" type="file" accept="image/*" capture="environment">
    <label class="big-button" for="file-input">Take a photo of the form</label>
    <input id="gallery-input" type="file" accept="image/*">
    <label class="big-button secondary" for="gallery-input">Upload from gallery</label>
  </section>

  <section id="crop" hidden>
    <div id="stage">
      <img id="photo" alt="The photo to crop">
      <svg id="outline" viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true">
        <polygon id="outline-shape" fill="rgba(31,95,191,.15)" stroke="#1f5fbf"
                 stroke-width="2" vector-effect="non-scaling-stroke"></polygon>
      </svg>
    </div>
    <progress id="progress" max="100" value="0" hidden></progress>
    <button class="big-button" id="submit" type="button">Submit</button>
    <button class="big-button secondary" id="retake" type="button">Retake</button>
  </section>

  <section id="done" hidden>
    <button class="big-button" id="another" type="button">Take another</button>
  </section>
</main>

<script>
(function () {
  "use strict";

  var token = location.pathname.split("/").pop();
  var api = "/api/capture-sessions/" + encodeURIComponent(token);
  var maxBytes = 15 * 1024 * 1024;

  var messages = {
    not_found: "This QR code is not valid. Ask for a new one on the computer.",
    validation_error: "This QR code is not valid. Ask for a new one on the computer.",
    already_claimed: "Another phone is already using this QR code. Make a new one on the computer.",
    session_expired: "This QR code has expired after 10 minutes without use. Make a new one on the computer.",
    session_closed: "This session was closed on the computer. Make a new QR code to continue.",
    not_authenticated: "This phone is not paired. Scan the QR code on the computer again.",
    forbidden: "This phone is not paired with this session. Scan the QR code on the computer again.",
    upload_limit_reached: "This session is full (50 photos). Make a new QR code on the computer.",
    length_required: "The photo could not be sent. Please try again.",
    file_too_large: "This photo is too large (15 MB limit). Choose a smaller one, or retake it at a lower camera resolution.",
    unsupported_image_type: "This file is not a usable photo. Choose a JPEG or PNG, or retake it.",
    heic_conversion_failed: "This photo format could not be read. Choose a JPEG or PNG, or set the camera to \"Most Compatible\" and retake.",
    storage_full: "The school computer's disk is full, so the photo was NOT saved. Please tell the IT in-charge."
  };
  // After these, retrying with this session cannot work.
  var sessionOver = { not_found: 1, already_claimed: 1, session_expired: 1, session_closed: 1,
                      not_authenticated: 1, forbidden: 1, upload_limit_reached: 1 };
  var networkError = "Could not reach the school computer. Check that this phone is on the school Wi-Fi, then try again. Your photo is still here.";

  var el = {};
  ["reference", "status", "ready", "crop", "done", "file-input", "gallery-input", "stage", "photo",
   "outline-shape", "progress", "submit", "retake", "another"].forEach(function (id) {
    el[id] = document.getElementById(id);
  });

  var names = ["top_left", "top_right", "bottom_right", "bottom_left"];
  var corners = {};
  var handles = {};
  var currentFile = null;
  var photoUrl = null;
  var reference = "";

  function show(section) {
    ["ready", "crop", "done"].forEach(function (name) { el[name].hidden = name !== section; });
  }

  function say(text, kind) {
    el.status.textContent = text;
    el.status.className = "message" + (kind ? " " + kind : "");
    el.status.hidden = !text;
  }

  function errorCode(xhrText) {
    try { return JSON.parse(xhrText).error; } catch (e) { return null; }
  }

  function resetCorners(inset) {
    corners.top_left = { x: inset, y: inset };
    corners.top_right = { x: 1 - inset, y: inset };
    corners.bottom_right = { x: 1 - inset, y: 1 - inset };
    corners.bottom_left = { x: inset, y: 1 - inset };
    drawCorners();
  }

  function drawCorners() {
    names.forEach(function (name) {
      handles[name].style.left = corners[name].x * 100 + "%";
      handles[name].style.top = corners[name].y * 100 + "%";
    });
    el["outline-shape"].setAttribute("points", names.map(function (name) {
      return corners[name].x + "," + corners[name].y;
    }).join(" "));
  }

  function clamp(value) { return Math.min(1, Math.max(0, value)); }

  function addHandle(name) {
    var handle = document.createElement("div");
    handle.className = "handle";
    handle.addEventListener("pointerdown", function (event) {
      handle.setPointerCapture(event.pointerId);
      event.preventDefault();
    });
    handle.addEventListener("pointermove", function (event) {
      if (!handle.hasPointerCapture(event.pointerId)) { return; }
      var box = el.stage.getBoundingClientRect();
      corners[name] = {
        x: clamp((event.clientX - box.left) / box.width),
        y: clamp((event.clientY - box.top) / box.height)
      };
      drawCorners();
    });
    el.stage.appendChild(handle);
    handles[name] = handle;
  }

  function startOver(text, kind) {
    if (photoUrl) { URL.revokeObjectURL(photoUrl); photoUrl = null; }
    currentFile = null;
    // Cleared so that choosing the same file again still fires `change`.
    el["file-input"].value = "";
    el["gallery-input"].value = "";
    el.photo.removeAttribute("src");
    show("ready");
    say(text, kind);
  }

  function sessionEnded(code) {
    show(null);
    say(messages[code] || "This session has ended.", "error");
  }

  function claim() {
    var xhr = new XMLHttpRequest();
    xhr.open("POST", api + "/claim");
    xhr.onload = function () {
      if (xhr.status === 200) {
        var body = JSON.parse(xhr.responseText);
        reference = body.reference_no;
        maxBytes = body.max_file_bytes;
        el.reference.textContent = "Reference: " + reference;
        startOver("Place the form on a flat surface in good light, then take the photo.");
      } else {
        sessionEnded(errorCode(xhr.responseText));
      }
    };
    xhr.onerror = function () {
      show(null);
      say("Could not reach the school computer. Check that this phone is on the school Wi-Fi, then reload this page.", "error");
    };
    xhr.send();
  }

  function setSending(sending) {
    el.submit.disabled = sending;
    el.retake.disabled = sending;
    el.progress.hidden = !sending;
    el.progress.value = 0;
  }

  function submit() {
    if (currentFile.size > maxBytes) {
      say(messages.file_too_large, "error");
      return;
    }
    var form = new FormData();
    form.append("corners", JSON.stringify(corners));
    form.append("file", currentFile, currentFile.name || "photo.jpg");

    var xhr = new XMLHttpRequest();
    xhr.open("POST", api + "/images");
    xhr.upload.onprogress = function (event) {
      if (event.lengthComputable) { el.progress.value = event.loaded / event.total * 100; }
    };
    xhr.onload = function () {
      setSending(false);
      if (xhr.status === 200 || xhr.status === 201) {
        var body = JSON.parse(xhr.responseText);
        startOver("");
        show("done");
        say((body.duplicate ? "Already saved earlier. " : "Sent to dashboard for review. ") +
            "Reference: " + body.reference_no, "success");
        return;
      }
      var code = errorCode(xhr.responseText);
      if (sessionOver[code]) {
        sessionEnded(code);
      } else if (code === "validation_error") {
        say("Drag the four dots to the corners of the form, keeping them in order, then submit again.", "error");
      } else {
        say(messages[code] || "The photo was not saved. Please try again.", "error");
      }
    };
    xhr.onerror = function () {
      setSending(false);
      el.submit.textContent = "Try again";
      say(networkError, "error");
    };
    say("Sending…");
    setSending(true);
    xhr.send(form);
  }

  function photoChosen(event) {
    var file = event.target.files[0];
    if (!file) { return; }
    currentFile = file;
    if (photoUrl) { URL.revokeObjectURL(photoUrl); }
    photoUrl = URL.createObjectURL(file);
    el.submit.textContent = "Submit";
    el.stage.hidden = false;
    show("crop");
    say("Drag the four dots to the corners of the form, then tap Submit.");
    resetCorners(0.05);
    el.photo.src = photoUrl;
  }

  el["file-input"].addEventListener("change", photoChosen);
  el["gallery-input"].addEventListener("change", photoChosen);

  el.photo.addEventListener("error", function () {
    // Some browsers cannot display HEIC. The server still can, so send the whole photo.
    if (!currentFile) { return; }
    el.stage.hidden = true;
    resetCorners(0);
    say("This phone cannot preview the photo, so the whole photo will be sent. Tap Submit.");
  });

  el.submit.addEventListener("click", submit);
  el.retake.addEventListener("click", function () { startOver("Take the photo again, or choose another."); });
  el.another.addEventListener("click", function () {
    startOver("Take the next photo.");
  });

  names.forEach(addHandle);
  claim();
})();
</script>
</body>
</html>
