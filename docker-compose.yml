# Local development database. If the host PC cannot run Docker, install
# PostgreSQL 17 natively and point DATABASE_URL at it (see README.md).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-archived}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archived}
      POSTGRES_DB: ${POSTGRES_DB:-archived}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
