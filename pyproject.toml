[project]
name = "archived-backend"
version = "0.1.0"
description = "Offline student enrollment and records backend for ArchivED"
requires-python = ">=3.12,<3.13"

# Exact pins live in requirements.txt / requirements-dev.txt so the offline
# host PC can install the same versions with `pip download -r`.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
